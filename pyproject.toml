[project]
name = "quicknote"
version = "0.1.0"
description = "A simple CLI note manager"
requires-python = ">=3.11"
dependencies = ["click>=8.4.1"]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "pytest-cov>=4.0",
  "ruff>=0.8",
  "mypy>=1.8",
  "pre-commit>=3.0",
]

[project.scripts]
quicknote = "quicknote.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--tb=short"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["quicknote"]

[tool.coverage.run]
source = ["quicknote"]

[tool.coverage.report]
fail_under = 70
show_missing = true
