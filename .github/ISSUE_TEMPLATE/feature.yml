name: Feature Request
description: Suggest a new feature for QuickNote
labels: ["enhancement"]
body:
  - type: textarea
    attributes:
      label: What problem does this solve?
      description: Describe the use case.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed solution
      description: How should this work?
  - type: dropdown
    attributes:
      label: Priority
      options:
        - Nice to have
        - Important
        - Critical
